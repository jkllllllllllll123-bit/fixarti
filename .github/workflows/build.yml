name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q fixarti.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: fixarti
        run: |
          flutter create . --platforms=android --project-name fixarti --org com.fixarti
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fixarti-apk
          path: fixarti/build/app/outputs/flutter-apk/app-release.apk
